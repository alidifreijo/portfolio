<script>
const H=document.getElementById('hmi');
const TAB={phone:[353.42,47],nav:[419.42,47],media:[484.42,47],settings:[555.42,68]};
function setMode(m){document.querySelectorAll('[data-mode]').forEach(e=>e.style.opacity=e.dataset.mode===m?1:0);
  const se=document.getElementById('sel');se.style.left=TAB[m][0]+'px';se.style.width=TAB[m][1]+'px';
  document.querySelectorAll('[data-tab]').forEach(e=>e.style.fontWeight=e.dataset.tab===m?600:500);}
function setState({sp,pw,boot}){ if(sp!=null){H.style.setProperty('--sp',Math.min(1,sp/140));document.getElementById('sp').textContent=Math.round(sp)}
  if(pw!=null){H.style.setProperty('--pw',Math.min(1,Math.max(0,pw)/130));document.getElementById('pw').textContent=Math.round(Math.abs(pw))}
  if(boot!=null)H.style.setProperty('--boot',boot);if(window.__stripes)applyStripes()}
setMode('nav');setState({sp:72,pw:65,boot:1});
window.HMI={setMode,setState};

// ── timeline (for video renders and the live hero) ──────────────────────
const WHEEL=`<svg id="whl" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3138"/><stop offset=".5" stop-color="#14191e"/><stop offset="1" stop-color="#0b0f13"/></linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e252c"/><stop offset="1" stop-color="#0d1115"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#e08a5c" stop-opacity=".9"/><stop offset="1" stop-color="#e08a5c" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- rim: round top, flat bottom, opens below the frame -->
  <path d="M600 40 C 320 40 110 210 110 470 L 110 620 L 230 620 L 230 470 C 230 280 400 160 600 160 C 800 160 970 280 970 470 L 970 620 L 1090 620 L 1090 470 C 1090 210 880 40 600 40 Z" fill="url(#rim)" stroke="#39424a" stroke-width="2"/>
  <rect x="588" y="40" width="24" height="120" rx="3" fill="#a85a37" opacity=".9"/>
  <!-- spokes and hub -->
  <path d="M230 430 L 430 400 L 470 520 L 240 560 Z" fill="url(#hub)" stroke="#2c343b" stroke-width="2"/>
  <path d="M970 430 L 770 400 L 730 520 L 960 560 Z" fill="url(#hub)" stroke="#2c343b" stroke-width="2"/>
  <path d="M430 380 Q 600 330 770 380 L 790 620 L 410 620 Z" fill="url(#hub)" stroke="#2c343b" stroke-width="2"/>

  <g fill="none" stroke="#56606a" stroke-width="3" stroke-linecap="round"><circle cx="330" cy="470" r="34"/><path d="M318 470 h24 M330 458 v24"/></g>
  <!-- right pod: mode switch -->

</svg><div class="cap" id="cap">steering wheel · <b id="cm">NAV</b></div>`;
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3), io=t=>{t=Math.max(0,Math.min(1,t));return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const q=(v,n)=>Math.floor(v*n)/n;             // stripe by stripe, not a smooth wipe
const grp=n=>[...document.querySelectorAll('[data-boot="'+n+'"]')];
const frameEl=document.getElementById('frame'), navEl=document.querySelector('[data-mode=nav]');
function boot(t){ // 0 → ~2.8s
  frameEl.style.opacity=ease(t/.35);
  setState({boot:q(io((t-.25)/.8),56)});                       // the grey scale climbs
  const sweep=t<1.15?0:t<1.75?io((t-1.15)/.6):1-.45*io((t-1.75)/.7); // levels charge to full, then settle
  const target={sp:72,pw:65};
  const sp=t<1.75?sweep*140:140-(140-target.sp)*io((t-1.75)/.7), pw=t<1.75?sweep*130:130-(130-target.pw)*io((t-1.75)/.7);
  H.style.setProperty('--sp',q(Math.min(1,sp/140),46)); H.style.setProperty('--pw',q(Math.min(1,pw/130),46));
  document.getElementById('sp').textContent=Math.round(sp); document.getElementById('pw').textContent=Math.round(pw);

          </div>

      </section>

            <div class="fill" style="position:absolute;left:0;right:0;bottom:0;height:0;background:${c};box-shadow:inset 0 0 0 1px rgba(201,184,163,.12)"></div>
            <div class="lab" style="position:absolute;left:20px;right:12px;bottom:22px;color:${ink}"><div style="font:500 22px Clash">${n}</div><div style="font:400 13px Clash;letter-spacing:.1em;margin-top:6px;opacity:.75">${c}</div><div style="font:400 13px Clash;letter-spacing:.06em;margin-top:18px;opacity:.9">${r}</div></div></div>`).join('')}
        </div>

    </div>`);
    const lines=s=>[...document.querySelectorAll(`#${s} .ln>*`)], rules=s=>[...document.querySelectorAll(`#${s} .rule`)];
    const tyL=lines('ty'),coL=lines('co'),fills=[...document.querySelectorAll('#bars .fill')],labs=[...document.querySelectorAll('#bars .lab')];

    const cap=document.getElementById('cap');
    const STEPS=[[0,'01 · the shell'],[2.1,'02 · menu & info bases'],[3.3,'03 · power & speed scales'],[5.6,'04 · sections & numbers'],[8.1,'05 · gears'],[8.9,'06 · road & route'],[10.7,'07 · next turn'],[11.9,''],[21.0,'08 · the display']];
    const T1=12.6,T1o=16.6,T2=17.0,T2o=20.4,T3=21.0;               // typeface in/out, colour in/out, display
    const inOut=(t,a,b,i,step=.09)=>{const k=io((t-a-i*step)/.75),o=io((t-b-i*.04)/.5);return [k,o]};
    window.seek=t=>{
      pencils.forEach(o=>{const k=io((t-o.at)/o.dur);o.c.style.opacity=t<o.at?0:1;
        if(o.sym!=null){const d=k*o.L/2;o.c.style.strokeDasharray=`${2*d} ${o.L-2*d+.01}`;o.c.style.strokeDashoffset=-(o.sym-d);}
        else if(o.rev){o.c.style.strokeDasharray=`${k*o.L} ${o.L}`;o.c.style.strokeDashoffset=-(o.L-k*o.L);}
        else{o.c.style.strokeDasharray=o.L;o.c.style.strokeDashoffset=o.L*(1-k);}});
      write.forEach(({t:e,at,dur})=>{const x=-14+114*io((t-at)/dur);e.style.webkitMaskImage=e.style.maskImage=`linear-gradient(90deg,#000 ${x}%,transparent ${x+14}%)`;});
      plains.forEach(({e,at})=>e.style.opacity=io((t-at)/.4));
      // wireframe leaves: it sinks back and dissolves
      const wo=io((t-11.9)/.9); C.style.opacity=1-wo; C.style.transform=`scale(${1.45*(1-.05*wo)})`; C.style.filter=`blur(${wo*3}px)`;
      // typeface
      tyL.forEach((e,i)=>{const [k,o]=inOut(t,T1,T1o,i);e.style.transform=`translateY(${(1-k)*110-o*110}%)`;});
      rules('ty').forEach(r=>r.style.transform=`scaleX(${io((t-T1)/.9)*(1-io((t-T1o)/.5))})`);
      // colour: bars rise in turn, then fall away
      coL.forEach((e,i)=>{const [k,o]=inOut(t,T2,T2o,i);e.style.transform=`translateY(${(1-k)*110-o*110}%)`;});
      rules('co').forEach(r=>r.style.transform=`scaleX(${io((t-T2)/.9)*(1-io((t-T2o)/.5))})`);
      fills.forEach((f,i)=>{const k=io((t-T2-.3-i*.13)/.9),o=io((t-T2o-(fills.length-1-i)*.06)/.6);f.style.height=(k*(1-o)*100)+'%';});
      labs.forEach((l,i)=>{const k=io((t-T2-.9-i*.13)/.5),o=io((t-T2o-.1)/.3);l.style.opacity=k*(1-o);l.style.transform=`translateY(${(1-k)*10}px)`;});
      // the display: rises out of the dark, tilting up into place
      const r=io((t-T3)/1.6);
      H.style.webkitMaskImage=H.style.maskImage='none';
      H.style.opacity=r; H.style.transform=`perspective(1800px) translateY(${(1-r)*70}px) rotateX(${(1-r)*22}deg) scale(${1.45*(.92+.08*r)})`;
      // then it comes alive
      const ch=t<T3+1.7?0:t<T3+2.7?io((t-T3-1.7)/1):1;
      const pw=t<T3+2.7?PWMAX*ch:t<T3+3.6?PWMAX+(34-PWMAX)*io((t-T3-2.7)/.9):34+5*Math.sin((t-T3-3.6)*1.2);
      const sp=t<T3+2.7?140*ch:t<T3+3.6?140+(46-140)*io((t-T3-2.7)/.9):46+2*Math.sin((t-T3-3.6)*.9);
      H.style.setProperty('--boot',1);H.style.setProperty('--pw',pw/PWMAX);H.style.setProperty('--sp',sp/140);applyStripes();
      spE.textContent=Math.round(sp);pwE.textContent=Math.round(pw);setNumColor(Math.max(0,Math.min(1,(pw-THR)/12+.5)));
      const gk=Math.max(0,Math.min(1,(t-T3)/(window.DUR-T3))); const gl=gk*gk*(3-2*gk)*.55+gk*.45;   // the glass light is there from the start and builds to the last frame
      light2.forEach(e=>e.style.opacity=.25+.75*gl); H.style.filter=`brightness(${(.55+.33*r)+.14*gl}) blur(${(1-r)*5}px)`;
      const sx=-60+((t-T3-3.6)/1.6)*160; sheen.style.background=false?`linear-gradient(115deg,transparent ${sx-12}%,rgba(255,255,255,.07) ${sx}%,transparent ${sx+12}%)`:'none';
      let s='';for(const [at,l] of STEPS) if(t>=at) s=l; cap.textContent=s;
    };
  }
  window.READY=false;document.fonts.ready.then(()=>{window.READY=true});}

</script>
<script>
// ── embeds for the website: hmi.html#embed-anatomy · hmi.html#embed-live ──
(()=>{const h=location.hash; if(!h.startsWith('#embed'))return;
  const H=document.getElementById('hmi'), W=976.372, HH=415.395;
  document.documentElement.style.background=document.body.style.background='transparent';
  document.body.style.cssText+=';margin:0;height:100vh;overflow:hidden;display:grid;place-items:center';
  const fit=()=>{const s=Math.min(innerWidth/(W*1.04),innerHeight/(HH*1.12));H.style.transform=`scale(${s})`;};
  addEventListener('resize',fit);fit();
  const css=document.createElement('style');css.textContent=`
    [data-tab]{cursor:pointer;pointer-events:auto}
    .hs{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;cursor:pointer;z-index:40;display:grid;place-items:center;font:600 10px Clash,sans-serif;color:#0B1620;background:#D9773F;box-shadow:0 0 0 0 rgba(217,119,63,.6);animation:hsP 2.4s infinite;border:0;padding:0}
    .hs:nth-child(2n){animation-delay:.6s}.hs:nth-child(3n){animation-delay:1.2s}
    .hs.on{background:#e7e2d8;animation:none;box-shadow:0 0 0 6px rgba(231,226,216,.18)}
    @keyframes hsP{0%{box-shadow:0 0 0 0 rgba(217,119,63,.55)}70%{box-shadow:0 0 0 12px rgba(217,119,63,0)}100%{box-shadow:0 0 0 0 rgba(217,119,63,0)}}
    .pop{position:absolute;z-index:41;width:250px;padding:14px 16px 15px;border-radius:10px;background:rgba(9,17,25,.94);border:1px solid rgba(201,184,163,.22);color:#c9c4b8;font:400 11.5px/1.5 Clash,sans-serif;letter-spacing:.02em;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none;backdrop-filter:blur(6px)}
    .pop b{display:block;font:600 11px Clash,sans-serif;letter-spacing:.14em;color:#D9773F;margin-bottom:6px}
    .pop.on{opacity:1;transform:none}
    .dim{position:absolute;inset:0;z-index:39;pointer-events:none;opacity:0;transition:opacity .3s}
    .dim.on{opacity:1}`;
  document.head.append(css);
  if(h==='#embed-anatomy'){
    setMode('nav');H.style.setProperty('--boot',1);H.style.setProperty('--pw',65/PWMAX);H.style.setProperty('--sp',72/140);applyStripes();
    document.getElementById('sp').textContent='72';document.getElementById('pw').textContent='65';setNumColor(0);
    const A=window.AXIS||491.9;
    const SPOTS=[
      [A,40,'MENU','Switch between navigation, media, phone and settings. A clear indicator at the top always shows where you are.'],
      [86,170,'ELECTRIC POWER INDICATOR','Real-time power, from eco to sport. It helps you read your driving style and get the most out of every charge.'],
      [A-110,235,'SECTION DIVISION','Three sections, two sides and a centre, set apart by thin lines and diagonals that bring movement and power to the layout.'],
      [745,150,'SPEEDOMETER','Racing-style speed graphics with large numbers: sporty, and readable at a single glance.'],
      [A-20,331,'BATTERY AND AUTONOMY','Charge and range, the vital pair. Minimal, with a nod to gaming interfaces.'],
      [A+150,368,'DYNAMISM AND SYMMETRY','The top menu and the bottom information frame the cockpit, giving it rhythm and putting the side sections forward.'],
      [940,262,'EFFICIENT USE OF SPACE','The display follows the physical shape of the dashboard, so every millimetre is used and the layout stays balanced.']];
    const dim=document.createElement('div');dim.className='dim';H.append(dim);
    const pop=document.createElement('div');pop.className='pop';H.append(pop);
    let cur=-1;
    const show=i=>{cur=i;hs.forEach((b,j)=>b.classList.toggle('on',j===i));
      if(i<0){pop.classList.remove('on');dim.classList.remove('on');return;}
      const [x,y,t,d]=SPOTS[i];pop.innerHTML=`<b>${String(i+1).padStart(2,'0')} · ${t}</b>${d}`;
      const left=x>W/2?x-270:x+20, top=Math.min(Math.max(y-20,10),HH-130);
      pop.style.left=left+'px';pop.style.top=top+'px';
      dim.style.background=`radial-gradient(circle 130px at ${x}px ${y}px,transparent 0,rgba(6,12,18,.55) 100%)`;
      pop.classList.add('on');dim.classList.add('on');};

    H.addEventListener('mouseleave',()=>show(-1));
  }
  if(h==='#embed-live'){
    // the real drive, looping in real time; the top menu can be tapped
    let mode='nav';
    document.querySelectorAll('[data-tab]').forEach(e=>e.addEventListener('click',()=>{mode=e.dataset.tab;setMode(mode);}));
    const t0=performance.now();
    const tick=()=>{const t=((performance.now()-t0)/1000)%DRIVE.T;
      const keep=[...document.querySelectorAll('[data-mode]')].map(e=>e.style.opacity);
      driveAt(t); if(mode!=='nav'){document.querySelectorAll('[data-mode]').forEach((e,i)=>e.style.opacity=keep[i]);}
      requestAnimationFrame(tick)};
    setMode('nav');tick();
  }
})();
</script>
