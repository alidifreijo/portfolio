- discriminant: list
  value:
    eyebrow: Who we designed for
    pill: User archetype
    columns: 2
    items:
    - title: Responsible role
      text: 'Company director and/or internal accountant.


        **Pain:** payment delays can lead to fines under the Law on Infringements and Sanctions in the Social Order.

        **Gain:** online banking and digital paperwork make money faster to access and manage.'
    - title: Employee role
      text: '**Pain:** depending on the day and the bank, salaries may only arrive at the start of the month.

        **Gain:** flexible payment deferral and invoice management let payroll adapt to the month’s expenses and savings.'
- discriminant: list
  value:
    eyebrow: What they need
    pill: User needs
    columns: 3
    items:
    - title: agile
      text: Few employees, so no complex features. It needs **versatility and flexibility** in managing payments.
    - title: fast
      text: Small companies don’t have a person per function. Processes must be **streamlined so nobody wastes time**.
    - title: flexible
      text: Many managers are self-employed owners. They need to **check invoicing easily, from anywhere**.
