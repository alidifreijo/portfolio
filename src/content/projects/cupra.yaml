roleText: |-
  My role is to bring clarity, keep alignment, and make sure what we design actually ships as intended.

  **Team coordination.** Keeps the design team aligned and moving, making sure decisions are clear and everyone knows what matters next.

  **Client alignment.** Leads presentations and discussions with Cupra stakeholders, translating messy context into direction the team can act on.

  **Infotainment integration.** Oversees the integration of UX and UI elements into the new infotainment system, ensuring coherence across interactions, components, and behaviors.
