intro: '**Monexa** is a banking platform used by both clients and bank employees. I designed the account platform and the **design system behind it**, from token architecture to light and dark modes, so one product could serve two very different audiences. The story below goes from the brief to the system: who it is for, how it is organised, how a client moves through it, and the identity that holds it together.'
