    - title: agile
      text: Few employees, so you don't need complex functionalities. It needs versatility and flexibility when it comes to managing payments.
    - title: fast
      text: A small company does not have specific employees for each function, many employees often have different responsibilities. This is why these processes have to be facilitated in order not to waste time.
    - title: flexible
      text: Many of the managers of these companies are the managers/self-employed themselves. That is why they need to be able to access and consult the company's invoicing easily and from anywhere.
