- title: Why it *exists*
  text: |-
    **It has to feel like cinema.** Films, series and puzzles, things I love, turned into something you can give. Not a complex interface: a **simple one, with a loud, direct UI** that could only belong to cinema.

    I also wanted to learn to take a site from zero to live on my own: repo, database and hosting, at the lowest cost and with no commercial aim.
  media:
  - src: /images/projects/cut-scenes/desktop-recipient.jpg
    width: 1600
    height: 1000
    alt: Recipient view in the inverted theme
    caption: Black on red, for whoever receives it
- title: How it *works*
  text: |-
    Four ways in, one ending: play, surprise, gift or make your own. Every path finishes with the credits.

    The small things took the longest. Skip ahead and the projectionist judges you: “Coward. Rolling anyway.” Extreme means 48 pieces and no outlines. Empty states stay in character: “No TV yet.”, and a surprise instead of a dead end.
