blocks:
- discriminant: quote
  value:
    eyebrow: Why I made it
    pill: The idea
    quote: It has to feel like cinema.
    body: 'Films, series and puzzles, things I love, turned into something you can give. Not a complex interface: a **simple one, with a loud, direct UI** that could only belong to cinema.'
    chips:
    - Simple, loud
    - Stays in character
    - Made to gift
