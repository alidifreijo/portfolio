- title: How it was *made*
  text: |-
    I set the brief, the references and the bar; Claude built with me in small steps. I set up the repo, the database and the hosting, and judged every change in the browser against one question: **does this still feel like a night at the movies?**

    Plain HTML, CSS and JS. Supabase for data, Vercel on every push. Anything uploaded waits for my approval. Eleven commits, one very long Friday.
