clues:
  - Every “final” version’s secret twin.
  - Fuel, personality, and coping mechanism, all in one cup.
  - Professionally asking strangers why they do things.
  - The UX cheat code for making humans feel seen.
  - Not ambition exactly, more like mild obsession in disguise.
  - If “why” were a person, it’d be me.
  - Where chaos goes for discipline (and typography rules).
  - That weird idea that somehow makes sense after three slides.
