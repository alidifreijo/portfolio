playTitle: let’s play
talkTitle: let’s talk
body: |-
  **Based in Barcelona**, open to senior and lead product roles, and **always up for a good conversation about messy problems.** Pick a channel below, or download the CV and judge me in private.

  Slightly suspicious recruiter? **The crossword has eight clues that pretty much sum me up.** Solve them and maybe we’ll both feel seen.
chat:
  - Oh hey, you found me!
  - I'm Ali, a product designer in **Barcelona**.
  - Ask me anything. Well, anything from the list.
chatReplies:
  - ask: What are you looking for?
    say: A **senior or lead product role**. And good conversations about messy problems, always.
    link: none
  - ask: Where can I see more of you?
    say: LinkedIn is the formal version of me
    link: linkedin
  - ask: Can I take your CV with me?
    say: Of course, here it is
    link: cv
  - ask: And when you're not designing?
    say: Watching too many films, mostly. Here's the proof
    link: letterboxd
  - ask: How do I get in touch?
    say: Easiest is email. I'd love to hear from you
    link: email
chatEnd: That's me, more or less. Hope we talk soon!
cv: /cv/Alida_Diaz_de_Freijo_CV.pdf
links:
  - label: LinkedIn
    url: https://www.linkedin.com/in/alidadiazdefreijo/
    icon: linkedin
  - label: Email
    url: mailto:adiazdefreijovalino@gmail.com
    icon: mail
  - label: Letterboxd
    url: https://letterboxd.com/alidifreijo/films/
    icon: film
clues:
  - Every “final” version’s secret twin.
  - Fuel, personality, and coping mechanism, all in one cup.
  - Professionally asking strangers why they do things.
  - The UX cheat code for making humans feel seen.
  - Not ambition exactly, more like mild obsession in disguise.
  - If “why” were a person, it’d be me.
  - Where chaos goes for discipline (and typography rules).
  - That weird idea that somehow makes sense after three slides.
