intro: 'Research, UX and UI, with an industrial designer’s habit of **thinking in systems, not just screens.** Curious by default, allergic to unnecessary complexity, and very into the small details that make people go “oh, nice.”


  When I’m not designing, **I’m probably doing a crossword, talking to my plants like they’re in the meeting,** or calling a desktop reorganisation self-care.'
