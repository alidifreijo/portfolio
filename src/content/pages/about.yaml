intro: 'Hey there!


  I’m a Product Designer who loves **turning messy ideas into things people actually enjoy using.**


  I’ve spent the last few years moving between research, UX, and UI — basically trying to **make digital experiences feel a bit more human** (and a lot less frustrating). My background in Industrial Design taught me to **think in systems, not just screens**: caring about how things work, not just how they look. Whether it’s an app, a platform, or something still living in a Figma graveyard, **I like to bring clarity where there’s chaos** — with a decent sense of humour and strong coffee supply.


  **I’m curious by default**, allergic to unnecessary complexity, and very into the small details that make users go “oh, nice.”

  “Final versions” don’t exist, only better ones.


  When I’m not designing, **I’m probably doing a crossword, talking to my plants like they’re in the meeting, or convincing myself that reorganizing my desktop counts as self-care.**'
