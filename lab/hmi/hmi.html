const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3), io=t=>{t=Math.max(0,Math.min(1,t));return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const q=(v,n)=>Math.floor(v*n)/n;             // stripe by stripe, not a smooth wipe
const grp=n=>[...document.querySelectorAll('[data-boot="'+n+'"]')];
const frameEl=document.getElementById('frame'), navEl=document.querySelector('[data-mode=nav]');
function boot(t){ // 0 → ~2.8s
  frameEl.style.opacity=ease(t/.35);
  setState({boot:q(io((t-.25)/.8),56)});                       // the grey scale climbs
  const sweep=t<1.15?0:t<1.75?io((t-1.15)/.6):1-.45*io((t-1.75)/.7); // levels charge to full, then settle

  H.style.setProperty('--sp',q(Math.min(1,sp/140),46)); H.style.setProperty('--pw',q(Math.min(1,pw/130),46));
  document.getElementById('sp').textContent=Math.round(sp); document.getElementById('pw').textContent=Math.round(pw);
  grp('dial').forEach(e=>e.style.opacity=ease((t-1.05)/.3));
  grp('menu').forEach((e,i)=>e.style.opacity=ease((t-1.5-i*.05)/.35));
  grp('info').forEach((e,i)=>e.style.opacity=ease((t-1.7-i*.08)/.35));
  navEl.style.opacity=ease((t-2.0)/.5);
}
window.boot=boot;
// mode slide used by the wheel demo: k in 0..1 between two modes
function slide(from,to,k,dir=1){
  document.querySelectorAll('[data-mode]').forEach(e=>{const m=e.dataset.mode;
    if(m===from){e.style.opacity=1-io(k*1.6);e.style.transform=`translateX(${-dir*60*io(k)}px)`}
    else if(m===to){e.style.opacity=io((k-.25)/.75);e.style.transform=`translateX(${dir*60*(1-io(k))}px)`}
    else{e.style.opacity=0}});
  const a=TAB[from],b=TAB[to],kk=io(k*1.3);const se=document.getElementById('sel');se.style.transition='none';
  se.style.left=(a[0]+(b[0]-a[0])*kk)+'px';se.style.width=(a[1]+(b[1]-a[1])*kk)+'px';
  document.querySelectorAll('[data-tab]').forEach(e=>e.style.fontWeight=e.dataset.tab===(k>.5?to:from)?600:500);
}
window.slide=slide;
// stage mode for renders: hmi.html#boot
if(location.hash){document.head.insertAdjacentHTML('beforeend','<style>.mode{transition:none!important}</style>');document.documentElement.style.background=document.body.style.background='#0B1620';H.style.transform='scale(1.45)';
  const T={'#boot':[boot,3.2]}[location.hash]; if(T){window.seek=T[0];window.DUR=T[1];T[0](0);}
  if(location.hash==='#drive'){
    // a seamless 10 s loop: accelerate, cruise, lift off (regen), the next turn comes closer
    window.DUR=10; const TAU=Math.PI*2, bl=[...document.querySelectorAll('[data-boot=menu] img, [data-boot=menu] .in img')].slice(0,2);
    window.seek=t=>{ const ph=t/10*TAU;
      const sp=78+34*Math.sin(ph)+5*Math.sin(3*ph), pw=60*Math.cos(ph)+8*Math.cos(3*ph)+10;
      setState({sp,pw:Math.max(0,pw),boot:1});
      const pwEl=document.getElementById('pw'); pwEl.textContent=Math.round(Math.abs(pw)); pwEl.style.color=pw<0?'#5f8fbf':'#7e4b35';
      const d=Math.max(0,500-(t%10)/10*560); document.getElementById('dist').textContent=d>0?Math.round(d/10)*10:'0';
      const blink=d<180&&d>0&&Math.floor(t*3)%2===0; document.querySelector('[data-boot=menu]').style.opacity=1;
      document.querySelectorAll('[data-boot="menu"]')[1].style.opacity=blink?1:.25;
      document.getElementById('clock').textContent='18:'+String(27+Math.floor(t/60)).padStart(2,'0');
    };
  }
  if(location.hash==='#build'){
    document.documentElement.style.background=document.body.style.background='#F9F9F9';
    H.insertAdjacentHTML('beforeend',[1,2,3,4].map(i=>`<img class="wire" id="w${i}" src="wire/w${i}.png" style="position:absolute;left:-10.5px;top:-1.5px;width:997px;height:458px;opacity:0;z-index:5;mix-blend-mode:multiply">`).join(''));
    document.body.insertAdjacentHTML('beforeend','<div id="cap" style="position:fixed;left:70px;bottom:56px;font:500 20px Clash,sans-serif;letter-spacing:.06em;color:#8b867c"></div>');
    const cap=document.getElementById('cap'), W=[...document.querySelectorAll('.wire')];
    const STEPS=[[0,'01 · the shape follows the dashboard'],[1.4,'02 · menu on top, the essentials below'],[2.6,'03 · two side panels, one road in the middle'],[3.8,'04 · the numbers that matter'],[5.0,'05 · switched on']];
    window.DUR=9; window.seek=t=>{
      W.forEach((w,i)=>{const A=[0,1.4,2.6,3.8],at=A[i],nx=A[i+1]??5;const k=io((t-at)/.6)*(1-io((t-nx)/.6));w.style.opacity=i===3?(t<5?io((t-at)/.6):1-io((t-5)/.7)):k;
        if(i===0)w.style.transform=`scale(${.96+.04*io(t/.8)})`;});

      let c=STEPS[0][1];for(const [at,l] of STEPS) if(t>=at) c=l; cap.textContent=c;

  if(location.hash==='#wheel'){

    H.style.cssText+=';position:absolute;left:50%;top:24px;transform:translateX(-50%) scale(1.08);transform-origin:50% 0';
    document.body.insertAdjacentHTML('beforeend',WHEEL);
    const st=document.createElement('style');st.textContent='#whl{position:absolute;left:50%;top:330px;transform:translateX(-50%) scale(.88);transform-origin:50% 0}.cap{position:absolute;left:80px;bottom:60px;font:500 22px Clash,sans-serif;color:#9e998e;letter-spacing:.06em}.cap b{color:#c06a43;font-weight:600}';document.head.append(st);
    const w=window; window.DUR=11;
    const steps=[['nav','media',1.6],['media','phone',4.2],['phone','settings',6.8],['settings','nav',9.2]];
const btn=document.getElementById('btn'),glw=document.getElementById('glw'),cm=document.getElementById('cm');
window.seek=t=>{
  // the car keeps driving under the menus
  const sp=72+10*Math.sin(t*.7)+4*Math.sin(t*1.9), pw=55+30*Math.sin(t*.7+.6);
  w.HMI.setState({sp,pw,boot:1});
  let from='nav',to='nav',k=1;
  for(const [a,b,at] of steps){ if(t>=at){from=a;to=b;k=Math.min(1,(t-at-.15)/.7);} }

  glw.setAttribute('opacity',press);
  document.getElementById("whl").style.transform=`translateX(-50%) scale(.88) rotate(${Math.sin(t*.6)*2.2}deg)`;
};
